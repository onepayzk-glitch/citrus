# Signed, notarized release. Runs on version tags (v1.0.0) or manually.
#
# Credentials are never committed. Add these repository secrets:
#   APPLE_CERT_P12_BASE64   base64 of the Developer ID Application .p12
#   APPLE_CERT_PASSWORD     password of that .p12
#   KEYCHAIN_PASSWORD       any temporary password for the CI keychain
#   APPLE_TEAM_ID           10-character Team ID
#   NOTARY_KEY_ID           App Store Connect API Key ID
#   NOTARY_ISSUER_ID        App Store Connect Issuer ID (UUID)
#   NOTARY_KEY_P8_BASE64    base64 of the AuthKey_*.p8 file
#
# Without those secrets the workflow refuses to publish: forks and pull requests
# never receive them, so their builds stay ad-hoc.
name: Signed release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g. 1.0.0)"
        required: true
      build_number:
        description: "Build number"
        required: false
        default: "1"
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          BUILD="${{ inputs.build_number }}"
          if [[ -z "$BUILD" ]]; then BUILD="${GITHUB_RUN_NUMBER}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION ($BUILD)"

      - name: Import Developer ID certificate
        env:
          CERT_B64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CERT_B64:-}" ]]; then
            echo "ERROR: APPLE_CERT_P12_BASE64 is not configured. Refusing to publish unsigned." >&2
            exit 1
          fi
          echo "$CERT_B64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security default-keychain -s build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security import /tmp/cert.p12 -k build.keychain-db -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain-db
          rm -f /tmp/cert.p12
          security find-identity -v -p codesigning

      - name: Store notarization credentials
        env:
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          KEY_P8_B64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEY_P8_B64:-}" ]]; then
            echo "ERROR: NOTARY_KEY_P8_BASE64 is not configured. Refusing to publish unnotarized." >&2
            exit 1
          fi
          echo "$KEY_P8_B64" | base64 --decode > /tmp/AuthKey.p8
          xcrun notarytool store-credentials "release-notary" \
            --key /tmp/AuthKey.p8 \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID"
          rm -f /tmp/AuthKey.p8

      - name: Build, sign, notarize and staple
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          NOTARY_PROFILE: release-notary
          BUNDLE_ID: com.onepayzk.opentangerine
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IDENTITY="$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "ERROR: no Developer ID Application identity in the temporary keychain" >&2
            exit 1
          fi
          DEVELOPER_ID_APPLICATION="$IDENTITY" ./scripts/package-release.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenTangerine-${{ steps.version.outputs.version }}
          path: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
          generate_release_notes: true
